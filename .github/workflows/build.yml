name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Install Dependencies
      run: flutter pub get
      working-directory: al_dahabi

    - name: Fix Gradle Version and Kotlin
      run: |
        rm -f android/local.properties
        mkdir -p android/gradle/wrapper
        echo "distributionBase=GRADLE_USER_HOME" > android/gradle/wrapper/gradle-wrapper.properties
        echo "distributionPath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties
        echo "distributionUrl=https\://services.gradle.org/distributions/gradle-7.6.3-bin.zip" >> android/gradle/wrapper/gradle-wrapper.properties
        
        # Mise à jour automatique de Kotlin 1.4 vers 1.8.22 dans les fichiers build.gradle
        python3 -c '
        import glob
        for filepath in glob.glob("android/**/build.gradle", recursive=True):
            with open(filepath, "r") as f:
                content = f.read()
            content = content.replace("1.4.0", "1.8.22").replace("1.4.32", "1.8.22").replace("1.4.20", "1.8.22")
            import re
            content = re.sub(r"kotlin_version\s*=\s*[\x27\x22]1\.[0-9](\.[0-9])?[\x27\x22]", "kotlin_version = \"1.8.22\"", content)
            content = re.sub(r"kotlinVersion\s*=\s*[\x27\x22]1\.[0-9](\.[0-9])?[\x27\x22]", "kotlinVersion = \"1.8.22\"", content)
            with open(filepath, "w") as f:
                f.write(content)
        '
      working-directory: al_dahabi

    - name: Build APK Release
      run: flutter build apk --release
      working-directory: al_dahabi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: al_dahabi/build/app/outputs/flutter-apk/app-release.apk
