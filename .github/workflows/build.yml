name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Install Dependencies
      run: flutter pub get
      working-directory: al_dahabi

    - name: Force Gradle 7.6.3 and Clean Properties
      run: |
        rm -f android/local.properties
        mkdir -p android/gradle/wrapper
        echo "distributionBase=GRADLE_USER_HOME" > android/gradle/wrapper/gradle-wrapper.properties
        echo "distributionPath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties
        echo "distributionUrl=https\://services.gradle.org/distributions/gradle-7.6.3-bin.zip" >> android/gradle/wrapper/gradle-wrapper.properties
        if [ -f android/gradle.properties ]; then
          grep -v "org.gradle.java.home" android/gradle.properties > android/gradle.properties.tmp
          mv android/gradle.properties.tmp android/gradle.properties
        fi
      working-directory: al_dahabi

    - name: Build APK Release
      run: flutter build apk --release
      working-directory: al_dahabi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: al_dahabi/build/app/outputs/flutter-apk/app-release.apk
