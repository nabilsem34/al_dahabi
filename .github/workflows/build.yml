name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Install Dependencies
      run: flutter pub get
      working-directory: al_dahabi

    - name: Force Clean Windows Paths and Update Configs
      run: |
        rm -f android/local.properties
        
        # Nettoyage de gradle.properties
        python3 -c '
        import os
        gp_path = "android/gradle.properties"
        if os.path.exists(gp_path):
            with open(gp_path, "r") as f:
                lines = f.readlines()
            with open(gp_path, "w") as f:
                for line in lines:
                    if "org.gradle.java.home" not in line:
                        f.write(line)
        '
        
        # Forcer Gradle 7.6.3
        mkdir -p android/gradle/wrapper
        echo "distributionBase=GRADLE_USER_HOME" > android/gradle/wrapper/gradle-wrapper.properties
        echo "distributionPath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties
        echo "distributionUrl=https\://services.gradle.org/distributions/gradle-7.6.3-bin.zip" >> android/gradle/wrapper/gradle-wrapper.properties

        # Remplacement agressif de Kotlin 1.4 par 1.8.22 dans tous les fichiers gradle et properties
        python3 -c '
        import glob, re
        for filepath in glob.glob("android/**/*", recursive=True):
            if filepath.endswith((".gradle", ".properties", ".kts")):
                try:
                    with open(filepath, "r", encoding="utf-8") as f:
                        content = f.read()
                    
                    # Remplace les blocs version "1.4..." ou kotlin_version = "1.4..."
                    content = re.sub(r"version\s*[\x27\x22]1\.4(\.[0-9]+)?[\x27\x22]", "version \"1.8.22\"", content)
                    content = re.sub(r"kotlin_version\s*=\s*[\x27\x22]1\.4(\.[0-9]+)?[\x27\x22]", "kotlin_version = \"1.8.22\"", content)
                    content = re.sub(r"kotlinVersion\s*=\s*[\x27\x22]1\.4(\.[0-9]+)?[\x27\x22]", "kotlinVersion = \"1.8.22\"", content)
                    
                    # Remplacements directs au cas échéant
                    content = content.replace("1.4.0", "1.8.22").replace("1.4.32", "1.8.22").replace("1.4.20", "1.8.22").replace("1.4.10", "1.8.22")
                    
                    with open(filepath, "w", encoding="utf-8") as f:
                        f.write(content)
                except Exception:
                    pass
        '
      working-directory: al_dahabi

    - name: Build APK Release
      run: flutter build apk --release
      working-directory: al_dahabi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: al_dahabi/build/app/outputs/flutter-apk/app-release.apk
